name: AI and runtime quality gate
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGSMITH_TRACING: 'false'
      GAME_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run offline tests including real MCP subprocess recovery
        run: python -m tools.run_checks
      - name: Preserve test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate
          path: runtime/verification/
          retention-days: 14
